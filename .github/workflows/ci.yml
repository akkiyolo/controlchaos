name: ControlChaos CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Lint with ruff
        run: ruff check backend

      - name: Type check with mypy
        run: mypy backend/app --ignore-missing-imports

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_controlchaos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Run test suite
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_controlchaos
          TEST_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_controlchaos
          JWT_SECRET: test-jwt-secret-min-32-chars-long-security-key
          AUDIT_HASH_SALT: test-audit-salt
          LLM_PROVIDER: mock
        run: |
          cd backend
          pytest -v --cov=app --cov-report=term-missing
